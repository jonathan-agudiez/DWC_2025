<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi colección de discos</title>
  <link rel="stylesheet" href="ejercicio01.css" />
</head>
<body>
  <h1>Mi colección de discos</h1>

  <div class="contenedor">
    <!-- =================== FORMULARIO =================== -->
    <section>
      <form id="formDisco" name="formDisco">
        <fieldset>
          <legend><strong>Nuevo disco</strong></legend>

          <div class="campo">
            <label for="nombre">Nombre del disco *</label>
            <input type="text" id="nombre" name="nombre" />
          </div>

          <div class="campo">
            <label for="caratula">Carátula (URL)</label>
            <input
              type="url"
              id="caratula"
              name="caratula"
              placeholder="https://ejemplo.com/portada.jpg"
            />
          </div>

          <div class="campo">
            <label for="grupo">Grupo / Intérprete *</label>
            <input type="text" id="grupo" name="grupo" />
          </div>

          <div class="fila">
            <div class="campo">
              <label for="anio">Año de publicación *</label>
              <input type="number" id="anio" name="anio" min="1900" max="2100" />
            </div>
            <div class="campo">
              <label for="genero">Género *</label>
              <select id="genero" name="genero">
                <option value="">-- Selecciona --</option>
                <option value="Rock">Rock</option>
                <option value="Pop">Pop</option>
                <option value="Jazz">Jazz</option>
                <option value="Metal">Metal</option>
                <option value="Clásica">Clásica</option>
                <option value="Electrónica">Electrónica</option>
              </select>
            </div>
          </div>

          <div class="fila fila-final">
            <div class="campo">
              <label for="localizacion">Localización (ES-001AA) *</label>
              <input
                type="text"
                id="localizacion"
                name="localizacion"
                placeholder="ES-001AA"
              />
            </div>
            <div class="checkbox-linea">
              <input type="checkbox" id="prestado" name="prestado" />
              <label for="prestado">Prestado</label>
            </div>
          </div>
        </fieldset>

        <div id="mensajeErrores" class="mensaje-errores"></div>

        <div class="botones-form">
          <!-- BOTÓN GUARDAR CON SVG -->
          <button type="submit" class="btn btn-primario" id="btn-guardar">
            <span class="btn-icon" aria-hidden="true">
              <!-- ICONO GUARDAR -->
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   fill="none"
                   class="icon">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
              </svg>
            </span>
          </button>

          <!-- BOTÓN MOSTRAR COLECCIÓN CON SVG -->
          <button type="button" class="btn btn-secundario" id="btn-mostrar">
            <span class="btn-icon" aria-hidden="true">
              <!-- ICONO MOSTRAR COLECCIÓN -->
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   fill="none"
                   class="icon">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </span>
          </button>
        </div>

        <div class="buscador">
          <div class="buscador-input-wrapper">
            <span class="buscador-icon" aria-hidden="true">
              <!-- ICONO SEARCH -->
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   fill="none"
                   class="icon">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
            </span>
            <input
              type="text"
              id="buscador"
              placeholder="Buscar por nombre o grupo..."
            />
          </div>

          <button type="button" class="btn btn-secundario" id="btn-buscar">
            <span class="btn-icon" aria-hidden="true">
              <!-- ICONO SEARCH -->
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   fill="none"
                   class="icon">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
            </span>
          </button>

          <button type="button" class="btn btn-terciario" id="btn-limpiar">
            <span class="btn-icon" aria-hidden="true">
              <!-- ICONO LIMPIAR -->
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor"
                   fill="none"
                   class="icon">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 9.75 14.25 12m0 0 2.25 2.25M14.25 12l2.25-2.25M14.25 12 12 14.25m-2.58 4.92-6.374-6.375a1.125 1.125 0 0 1 0-1.59L9.42 4.83c.21-.211.497-.33.795-.33H19.5a2.25 2.25 0 0 1 2.25 2.25v10.5a2.25 2.25 0 0 1-2.25 2.25h-9.284c-.298 0-.585-.119-.795-.33Z" />
              </svg>
            </span>
          </button>
        </div>
      </form>
    </section>

    <!-- =================== LISTADO =================== -->
    <section id="listado">
      <div id="listado-vacio">No hay discos en la colección todavía.</div>
      <div class="rejilla-discos" id="rejilla-discos"></div>
    </section>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
