<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 5-04: Ejercicio 01</title>

    <link rel="stylesheet" href="./ejercicio01.css">
</head>
<body>

<section id="zona-con-arrastrar">

    <div id="arrastrables">

        <!-- 9 piezas iniciales -->
        <div class="arrastrable" id="wrapper1"><img class="imagen" id="1" src="./img/1.png"></div>
        <div class="arrastrable" id="wrapper2"><img class="imagen" id="2" src="./img/2.png"></div>
        <div class="arrastrable" id="wrapper3"><img class="imagen" id="3" src="./img/3.png"></div>
        <div class="arrastrable" id="wrapper4"><img class="imagen" id="4" src="./img/4.png"></div>
        <div class="arrastrable" id="wrapper5"><img class="imagen" id="5" src="./img/5.png"></div>
        <div class="arrastrable" id="wrapper6"><img class="imagen" id="6" src="./img/6.png"></div>
        <div class="arrastrable" id="wrapper7"><img class="imagen" id="7" src="./img/7.png"></div>
        <div class="arrastrable" id="wrapper8"><img class="imagen" id="8" src="./img/8.png"></div>
        <div class="arrastrable" id="wrapper9"><img class="imagen" id="9" src="./img/9.png"></div>

    </div>

    <div id="soltables" class="puzzle-stage">

        <!-- Grid → 3 columnas × 3 filas -->
        <div class="drop-grid">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div id="controles">
        <button id="btn-reiniciar" class="reiniciar-puzzle" aria-label="Reiniciar puzzle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>Reiniciar
        </button>
        <div class="resultado"></div>
    </div>

</section>

<script type="module" src="./principal.js"></script>

</body>
</html>
